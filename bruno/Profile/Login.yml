info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/login"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: secti@gmail.com
      - name: password
        type: text
        value: Ti@2021*
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (res.getStatus() === 200) {
            bru.setVar('authToken', data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
